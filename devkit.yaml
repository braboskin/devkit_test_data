version: 1
project:
  slug: atlas
  name: Atlas
repos:
  - name: atlas
    url: https://github.com/xaylpq/atlas.git
    branch: main
profile:
  app:
    name: atlas
    description: "Atlas — личная ОС знаний: ingestion, поиск, MCP, FastAPI-бэкенд"
    stack:
      - python
      - fastapi
      - sqlalchemy
      - qdrant
      - typescript
      - react
      - vite
  commands:
    verification:
      - name: web-build
        required: true
        run:
          windows: npm run build
          darwin: npm run build
          linux: npm run build
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 600
      - name: typecheck-web
        required: true
        run:
          windows: npx tsc --noEmit
          darwin: npx tsc --noEmit
          linux: npx tsc --noEmit
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 300
      - name: lint-web
        required: true
        run:
          windows: npx eslint .
          darwin: npx eslint .
          linux: npx eslint .
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 300
      - name: arch-web
        required: true
        run:
          windows: npx steiger ./src
          darwin: npx steiger ./src
          linux: npx steiger ./src
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 300
      - name: e2e
        required: true
        run:
          windows: npx playwright install chromium && npx playwright test --grep-invert "axe:"
          darwin: npx playwright install chromium && npx playwright test --grep-invert "axe:"
          linux: npx playwright install chromium && npx playwright test --grep-invert "axe:"
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 900
      - name: a11y
        required: true
        run:
          windows: npx playwright test a11y.spec.ts
          darwin: npx playwright test a11y.spec.ts
          linux: npx playwright test a11y.spec.ts
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 900
      - name: unit-tests
        required: true
        run:
          windows: .venv\Scripts\python.exe -m unittest discover -s tests
          darwin: .venv/bin/python -m unittest discover -s tests
          linux: .venv/bin/python -m unittest discover -s tests
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 1200
      - name: lint-python
        required: true
        run:
          windows: .venv\Scripts\python.exe -m ruff check .
          darwin: .venv/bin/python -m ruff check .
          linux: .venv/bin/python -m ruff check .
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
      - name: typecheck-python
        required: true
        run:
          windows: .venv\Scripts\python.exe -m mypy
          darwin: .venv/bin/python -m mypy
          linux: .venv/bin/python -m mypy
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 600
      - name: arch-python
        required: true
        run:
          windows: .venv\Scripts\python.exe -m unittest tests.test_architecture
          darwin: .venv/bin/python -m unittest tests.test_architecture
          linux: .venv/bin/python -m unittest tests.test_architecture
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
      - name: format-web
        required: false
        run:
          windows: npx prettier --check .
          darwin: npx prettier --check .
          linux: npx prettier --check .
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 300
      - name: schema-check
        required: false
        run:
          windows: powershell -NoProfile -ExecutionPolicy Bypass -Command "$o = (&
            .\scripts\validate-schema.ps1) 2>&1 | Out-String; Write-Host $o; if
            ($o -match 'ERROR:') { exit 1 }"
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
    setup:
      - name: create-venv
        required: false
        run:
          windows: C:\ProgramData\anaconda3\python.exe -m venv .venv
          darwin: python3 -m venv .venv
          linux: python3 -m venv .venv
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
      - name: install-requirements
        required: false
        run:
          windows: .venv\Scripts\python.exe -m pip install -r requirements.txt
          darwin: .venv/bin/python -m pip install -r requirements.txt
          linux: .venv/bin/python -m pip install -r requirements.txt
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 1800
      - name: install-dev-requirements
        required: false
        run:
          windows: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          darwin: .venv/bin/python -m pip install -r requirements-dev.txt
          linux: .venv/bin/python -m pip install -r requirements-dev.txt
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 600
      - name: install-web
        required: false
        run:
          windows: npm ci
          darwin: npm ci
          linux: npm ci
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\web
        timeoutSec: 900
  docs:
    readme: repo/atlas/README.md
    agents: AGENTS.md
    schema: repo/atlas/docs/SCHEMA.md
  tools:
    - graphify
    - ponytail
