version: 1
project:
  slug: atlas
  name: Atlas
repos:
  - name: atlas
    url: https://github.com/xaylpq/atlas.git
    branch: main
profile:
  app:
    name: atlas
    description: "Atlas вЂ” Р»РёС‡РЅР°СЏ РћРЎ Р·РЅР°РЅРёР№: ingestion, РїРѕРёСЃРє,
      MCP, FastAPI-Р±СЌРєРµРЅРґ"
    stack:
      - python
      - fastapi
      - sqlalchemy
      - qdrant
      - typescript
      - react
      - vite
  commands:
    verification:
      - name: web-build
        required: true
        run:
          windows: npm run build
          darwin: npm run build
          linux: npm run build
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\viewer
        timeoutSec: 600
      - name: typecheck-web
        required: true
        run:
          windows: npx tsc --noEmit
          darwin: npx tsc --noEmit
          linux: npx tsc --noEmit
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\viewer
        timeoutSec: 300
      - name: lint-python
        required: true
        run:
          windows: .venv\Scripts\python.exe -m ruff check app scripts --select E4,E7,F
          darwin: .venv/bin/python -m ruff check app scripts --select E4,E7,F
          linux: .venv/bin/python -m ruff check app scripts --select E4,E7,F
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
      - name: unit-tests
        required: true
        run:
          windows: .venv\Scripts\python.exe -m unittest tests.test_app_auth
            tests.test_migrations tests.test_spheres_projects tests.test_people
            tests.test_tasks tests.test_events tests.test_isolation
            tests.test_growth tests.test_web_build tests.test_knowledge
            tests.test_documents tests.test_worker tests.test_worker_pg
            tests.test_http_fetch tests.test_search tests.test_yadisk
            tests.test_ingest_isolation tests.test_ingest_acceptance
            tests.test_followup_acceptance tests.test_agent_llm
            tests.test_agent_onboarding tests.test_agent_chat
            tests.test_agent_proposals tests.test_agent_builder
            tests.test_agent_isolation tests.test_agent_subagents
            tests.test_agent_scenario_runs tests.test_chunking tests.test_eval
            tests.test_import_obsidian
            tests.test_ingest.IngestTests.test_blank_image_needs_review
            tests.test_ingest.IngestTests.test_documents_processed
            tests.test_ingest.IngestTests.test_empty_body_needs_review
            tests.test_ingest.IngestTests.test_rerun_is_idempotent
            tests.test_triage tests.test_push
          darwin: .venv/bin/python -m unittest tests.test_app_auth tests.test_migrations
            tests.test_spheres_projects tests.test_people tests.test_tasks
            tests.test_events tests.test_isolation tests.test_growth
            tests.test_web_build tests.test_knowledge tests.test_documents
            tests.test_worker tests.test_worker_pg tests.test_http_fetch
            tests.test_search tests.test_yadisk tests.test_ingest_isolation
            tests.test_ingest_acceptance tests.test_followup_acceptance
            tests.test_agent_llm tests.test_agent_onboarding
            tests.test_agent_chat tests.test_agent_proposals
            tests.test_agent_builder tests.test_agent_isolation
            tests.test_agent_subagents tests.test_agent_scenario_runs
            tests.test_chunking tests.test_eval tests.test_import_obsidian
            tests.test_ingest.IngestTests.test_blank_image_needs_review
            tests.test_ingest.IngestTests.test_documents_processed
            tests.test_ingest.IngestTests.test_empty_body_needs_review
            tests.test_ingest.IngestTests.test_rerun_is_idempotent
            tests.test_triage tests.test_push
          linux: .venv/bin/python -m unittest tests.test_app_auth tests.test_migrations
            tests.test_spheres_projects tests.test_people tests.test_tasks
            tests.test_events tests.test_isolation tests.test_growth
            tests.test_web_build tests.test_knowledge tests.test_documents
            tests.test_worker tests.test_worker_pg tests.test_http_fetch
            tests.test_search tests.test_yadisk tests.test_ingest_isolation
            tests.test_ingest_acceptance tests.test_followup_acceptance
            tests.test_agent_llm tests.test_agent_onboarding
            tests.test_agent_chat tests.test_agent_proposals
            tests.test_agent_builder tests.test_agent_isolation
            tests.test_agent_subagents tests.test_agent_scenario_runs
            tests.test_chunking tests.test_eval tests.test_import_obsidian
            tests.test_ingest.IngestTests.test_blank_image_needs_review
            tests.test_ingest.IngestTests.test_documents_processed
            tests.test_ingest.IngestTests.test_empty_body_needs_review
            tests.test_ingest.IngestTests.test_rerun_is_idempotent
            tests.test_triage tests.test_push
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 1200
      - name: typecheck-python
        required: false
        run:
          windows: .venv\Scripts\python.exe -m mypy app --ignore-missing-imports
          darwin: .venv/bin/python -m mypy app --ignore-missing-imports
          linux: .venv/bin/python -m mypy app --ignore-missing-imports
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 600
      - name: schema-check
        required: false
        run:
          windows: powershell -NoProfile -ExecutionPolicy Bypass -Command "$o = (&
            .\scripts\validate-schema.ps1) 2>&1 | Out-String; Write-Host $o; if
            ($o -match 'ERROR:') { exit 1 }"
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
    setup:
      - name: create-venv
        required: false
        run:
          windows: C:\ProgramData\anaconda3\python.exe -m venv .venv
          darwin: python3 -m venv .venv
          linux: python3 -m venv .venv
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 300
      - name: install-requirements
        required: false
        run:
          windows: .venv\Scripts\python.exe -m pip install -r requirements.txt
          darwin: .venv/bin/python -m pip install -r requirements.txt
          linux: .venv/bin/python -m pip install -r requirements.txt
        cwd: X:\devkit_projects\projects\atlas\repo\atlas
        timeoutSec: 1800
      - name: install-viewer
        required: false
        run:
          windows: npm ci
          darwin: npm ci
          linux: npm ci
        cwd: X:\devkit_projects\projects\atlas\repo\atlas\viewer
        timeoutSec: 900
  docs:
    readme: repo/atlas/README.md
    agents: AGENTS.md
    schema: repo/atlas/docs/SCHEMA.md
  tools:
    - graphify
    - ponytail
